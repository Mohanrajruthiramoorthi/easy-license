spring:
  application:
    name: easy-license-backend

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

info:
  application:
    name: Easy License
    description: Standalone licensing platform
    version: 0.1.0-SNAPSHOT
