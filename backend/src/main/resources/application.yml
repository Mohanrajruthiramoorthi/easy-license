spring:
  application:
    name: easy-license-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/easy_license}
    username: ${DATABASE_USERNAME:easy_license}
    password: ${DATABASE_PASSWORD:local_dev_only}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

info:
  application:
    name: Easy License
    description: Standalone licensing platform
    version: 0.1.0-SNAPSHOT
