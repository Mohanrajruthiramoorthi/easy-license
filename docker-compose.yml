services:
  postgres:
    image: postgres:17
    container_name: easy-license-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easy_license}
      POSTGRES_USER: ${POSTGRES_USER:-easy_license}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - easy-license-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easy_license} -d ${POSTGRES_DB:-easy_license}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  easy-license-postgres-data:
