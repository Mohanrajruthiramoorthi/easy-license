# Zero-cost MVP deployment. No paid Render resources or Render Postgres databases.
# Render free web services sleep when idle; Neon provides the persistent PostgreSQL database.
services:
  - type: web
    name: easy-license-api
    runtime: docker
    region: singapore
    plan: free
    branch: main
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      # Create a Neon PostgreSQL 17 project and enter these values in Render.
      # Use the pooled Neon hostname and require SSL.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DB_POOL_MAX_SIZE
        value: "3"
      - key: DB_POOL_MIN_IDLE
        value: "0"
