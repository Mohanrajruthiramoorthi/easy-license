# Render Blueprint for isolated staging and production environments.
# Both services and their databases are deployed in Singapore.
services:
  - type: web
    name: easy-license-api-staging
    runtime: docker
    region: singapore
    plan: free
    branch: feature/backend-foundation
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: DB_HOST
        fromDatabase:
          name: easy-license-staging-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: easy-license-staging-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: easy-license-staging-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: easy-license-staging-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: easy-license-staging-db
          property: password
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "1"

  - type: web
    name: easy-license-api-production
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    branch: main
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_HOST
        fromDatabase:
          name: easy-license-production-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: easy-license-production-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: easy-license-production-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: easy-license-production-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: easy-license-production-db
          property: password
      - key: DB_POOL_MAX_SIZE
        value: "10"
      - key: DB_POOL_MIN_IDLE
        value: "2"

databases:
  - name: easy-license-staging-db
    region: singapore
    plan: free
    postgresMajorVersion: "17"
    databaseName: easy_license_staging
    user: easy_license_staging
    ipAllowList: []

  - name: easy-license-production-db
    region: singapore
    plan: 256mb
    postgresMajorVersion: "17"
    databaseName: easy_license_production
    user: easy_license_production
    ipAllowList: []
